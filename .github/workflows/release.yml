name: Release

# Releases are cut by either:
#   - editing `.release-tag` (the new tag name, e.g. v0.1.0) and pushing, or
#   - running this workflow manually from the Actions tab with a tag input.
# The tag itself is created by action-gh-release at the built commit, so no
# tag push permissions are needed.
on:
  push:
    branches: ["**"]
    paths: [".release-tag"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-universal
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libgl-dev libjack-jackd2-dev libx11-xcb-dev \
            libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build CLAP bundle
        if: runner.os != 'macOS'
        run: cargo xtask bundle polysynth --release

      - name: Build CLAP bundle (universal)
        if: runner.os == 'macOS'
        run: cargo xtask bundle-universal polysynth --release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd target/bundled
          zip -r ../../PolySynth-${{ matrix.name }}.zip PolySynth.clap

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd target/bundled
          # ditto preserves the .clap bundle's structure and permissions
          ditto -c -k --keepParent PolySynth.clap ../../PolySynth-${{ matrix.name }}.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/bundled/PolySynth.clap -DestinationPath PolySynth-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PolySynth-${{ matrix.name }}
          path: PolySynth-${{ matrix.name }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="$(tr -d '[:space:]' < .release-tag)"
          fi
          if [ -z "$tag" ]; then
            echo "No release tag given; failing." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PolySynth ${{ steps.tag.outputs.tag }}
          files: PolySynth-*.zip
          generate_release_notes: true
